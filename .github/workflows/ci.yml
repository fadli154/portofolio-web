name: Portfolio CI & Security Pre-Deploy Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-and-security-gate:
    name: Typecheck, Secret Scan & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zero Hardcoded Private Keys or Secrets
        run: |
          if grep -RInE "(SUPABASE_SERVICE_ROLE_KEY|PRIVATE_KEY|SECRET_KEY)\s*=\s*['\"][^'\"]{16,}['\"]" src/ supabase/; then
            echo "Secret leak detected in source!"
            exit 1
          fi

      - name: Verify 100% RLS Coverage in Migrations
        run: |
          grep -q "enable row level security" supabase/migrations/20261110000002_rls_policies.sql

      - name: TypeScript Strict Verification
        run: npm run typecheck

      - name: Next.js Production Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://fadli-portofolio.vercel.app
        run: npm run build

