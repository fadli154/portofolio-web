<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390">
  <defs>
    <!-- Drop shadows -->
    <filter id="folder-drop-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(0,0,0,0.38)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
    
    <filter id="paper-drop-shadow-1" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="-2" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.24)"/>
    </filter>
    <filter id="paper-drop-shadow-2" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="rgba(0,0,0,0.28)"/>
    </filter>
    <filter id="paper-drop-shadow-3" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.22)"/>
    </filter>

    <filter id="front-shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="rgba(0,0,0,0.25)"/>
    </filter>

    <!-- Folder Gradients -->
    <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="frontGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="frontHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
  </defs>

  <!-- 1. BACK FOLDER SILHOUETTE (With Tab) -->
  <g filter="url(#folder-drop-shadow)">
    <path d="M 0 60 Q 0 36 24 36 L 276 36 C 300 36 300 0 324 0 L 466 0 C 490 0 490 36 514 36 L 536 36 Q 560 36 560 60 L 560 366 Q 560 390 536 390 L 24 390 Q 0 390 0 366 Z" fill="url(#backGrad)" />
    
    <!-- Tab Text Label -->
    <text x="395" y="24" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="700" 
          fill="#ffffff" 
          letter-spacing="0.04em"
          text-anchor="middle">
      EXP-01 · SIMDUK
    </text>
  </g>

  <!-- 2. FANNED OUT WHITE DOCUMENT PAPERS -->
  
  <!-- Sheet 1: Left Paper (-5 deg) -->
  <g transform="rotate(-5, 175, 190)" filter="url(#paper-drop-shadow-1)">
    <rect x="55" y="60" width="230" height="230" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Paper Header -->
    <rect x="73" y="78" width="60" height="18" rx="9" fill="#0f172a"/>
    <text x="103" y="91" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOC-01
    </text>
    <!-- Paper Title -->
    <text x="73" y="118" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">
      Ringkasan Eksekutif & De...
    </text>
    <!-- Paper Simulated Content Lines -->
    <rect x="73" y="132" width="180" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="73" y="144" width="160" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="73" y="156" width="140" height="5" rx="2.5" fill="#e2e8f0"/>
  </g>

  <!-- Sheet 3: Right Paper (+5 deg) -->
  <g transform="rotate(5, 375, 190)" filter="url(#paper-drop-shadow-3)">
    <rect x="270" y="62" width="230" height="230" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Paper Header -->
    <rect x="288" y="80" width="60" height="18" rx="9" fill="#334155"/>
    <text x="318" y="93" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOC-03
    </text>
    <!-- Paper Title -->
    <text x="288" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">
      RBAC Multi-Level Kelurah...
    </text>
    <!-- Paper Simulated Content Lines -->
    <rect x="288" y="134" width="180" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="288" y="146" width="150" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="288" y="158" width="130" height="5" rx="2.5" fill="#e2e8f0"/>
  </g>

  <!-- Sheet 2: Center Main Hero Paper (0 deg) -->
  <g filter="url(#paper-drop-shadow-2)">
    <rect x="155" y="44" width="250" height="240" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Paper Header Badge & Page Num -->
    <rect x="175" y="64" width="68" height="20" rx="10" fill="#2563eb"/>
    <text x="209" y="78" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
      DOC-02
    </text>
    <text x="385" y="78" font-family="monospace" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">
      02/03
    </text>
    <!-- Paper Main Title -->
    <text x="175" y="108" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">
      Optimasi Database & Se...
    </text>
    <text x="175" y="126" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
      Query relasional terindeks & ekspo...
    </text>
    <!-- Crisp Document Simulation Lines -->
    <rect x="175" y="142" width="205" height="5.5" rx="2.75" fill="#94a3b8"/>
    <rect x="175" y="154" width="185" height="5.5" rx="2.75" fill="#cbd5e1"/>
    <rect x="175" y="166" width="195" height="5.5" rx="2.75" fill="#e2e8f0"/>
  </g>

  <!-- 3. FRONT FOLDER FLAP (The signature pocket) -->
  <g filter="url(#front-shadow)">
    <path d="M 0 170 Q 0 146 24 146 L 536 146 Q 560 146 560 170 L 560 366 Q 560 390 536 390 L 24 390 Q 0 390 0 366 Z" fill="url(#frontGrad)" />
    
    <!-- Top Edge Highlight Sheen -->
    <path d="M 0 170 Q 0 146 24 146 L 536 146 Q 560 146 560 170" 
          fill="none" stroke="url(#frontHighlight)" stroke-width="2.5" />
    
    <!-- Subtle Inner Bevel / Folder Line -->
    <rect x="28" y="174" width="504" height="188" rx="16" 
          fill="rgba(0,0,0,0.12)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />

    <!-- Content on Front Flap: Editorial Showcase -->
    <g transform="translate(48, 194)">
      <!-- Badge -->
      <rect x="0" y="0" width="114" height="22" rx="11" fill="rgba(255,255,255,0.22)"/>
      <text x="57" y="15" 
            font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">
        MAGANG RESMI
      </text>

      <!-- Year -->
      <text x="464" y="15" 
            font-family="monospace" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.85)" text-anchor="end">
        2025
      </text>

      <!-- Main Title on Flap -->
      <text x="0" y="52" 
            font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
        Web Developer Intern
      </text>
      
      <!-- Subtitle / Organization -->
      <text x="0" y="74" 
            font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)">
        Dinas Kominfo
      </text>

      <!-- Interactive Cue Pill -->
      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
        <text x="110" y="19" 
              font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">
          ✦ KLIK UNTUK BUKA BERKAS 3D
        </text>
      </g>
    </g>
  </g>
</svg>